[build]
  command = "pnpm audit --audit-level=high && pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.9.0"

# ---------- Security headers (every page) ----------
[[headers]]
  for = "/*"
  [headers.values]
    # Only this site's own files may load: no inline scripts, no third-party code.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Hashed build files never change, so browsers can cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean-up worker for the old Gatsby offline cache: always re-checked.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ---------- Old Gatsby URLs ----------
[[redirects]]
  from = "/resume"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/my-files"
  to = "/"
  status = 301

[[redirects]]
  from = "/first-post"
  to = "/writings/"
  status = 301

[[redirects]]
  from = "/second-post"
  to = "/writings/"
  status = 301

[[redirects]]
  from = "/success"
  to = "/thanks/"
  status = 301

[[redirects]]
  from = "/page-data/*"
  to = "/"
  status = 301
