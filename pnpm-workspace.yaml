# Supply-chain guardrails — see README "Security".

# Only install package versions that have been public for 7+ days.
# Hijacked releases are almost always caught and pulled within hours.
minimumReleaseAge: 10080
# Deliberate, reviewed exceptions only (e.g. a fresh security patch).
minimumReleaseAgeExclude:
  - source-map-js@1.2.2 # GHSA-68fv-2mgg-jv7q fix; already vetted in TrendWake

# Refuse a package version that drops the publishing provenance its
# earlier versions had (a common sign of a stolen maintainer token).
trustPolicy: no-downgrade

# Dependency install scripts are blocked unless listed here.
allowBuilds:
  esbuild: true

# Patched transitive versions (re-check with `pnpm audit`; drop once upstream catches up).
overrides:
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
